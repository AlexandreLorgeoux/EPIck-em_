name: CI

on:
  pull_request:

permissions:
  contents: read

# Cancel the previous run when new commits are pushed to the same PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # e2e tests run against a real database; they create and migrate
    # "<db>_test" from this URL themselves
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epickem
          POSTGRES_PASSWORD: epickem
          POSTGRES_DB: epickem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epickem -d epickem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://epickem:epickem@localhost:5432/epickem

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 24 ships npm 11; npm 10 crashes resolving this lockfile
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install
        run: npm ci

      # The client is generated (not committed) and imported by lint and tests
      - name: Generate Prisma client
        run: npm run db:generate -w apps/api

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e -w apps/api

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
